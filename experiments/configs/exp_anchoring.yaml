# Experiment B: Anchoring Effect
# Manipulate initial offer aggressiveness and measure influence
# on final deal price.  Uses free-language agents — the anchoring
# effect is most interesting when the agent can be influenced by
# its opening position.
#
# Conditions (in experiments.py) vary buyer_value to shift ZOPA:
#   anchor_low  ($100), anchor_mid ($120), anchor_high ($150)
agent_type: llm_free_language
steps: 5
buyers_per_step: 10
sellers_per_step: 10
seed: 42
scenario_mode: fixed

llm:
  backend: huggingface
  model: Qwen/Qwen2.5-14B-Instruct
  temperature: 0.2
  max_tokens: 512
  timeout_sec: 60.0
  max_retries: 3

fixed:
  buyer_value: 120.0
  buyer_budget: 130.0
  buyer_patience: 5
  seller_cost: 80.0
  seller_target_margin: 0.15
  seller_patience: 5
  item_reference_price: 100.0

negotiation:
  max_rounds: 10
  min_price: 1.0
  max_price: 500.0
  gate_enabled: false

prompt:
  include_deadline_salience: true
  include_objective_equations: true
  include_history_summary: true

shock:
  enabled: false
