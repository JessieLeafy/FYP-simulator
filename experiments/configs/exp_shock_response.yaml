# Experiment E: Shock Response
# Market mode with demand/supply shocks enabled to observe
# price adjustment and surplus redistribution.
# Uses free-language agents to study how LLMs adapt to shocks.
#
# Conditions (in experiments.py): no_shock vs with_shock
agent_type: llm_free_language
mode: market
steps: 10
buyers_per_step: 10
sellers_per_step: 10
seed: 42
scenario_mode: distribution

llm:
  backend: huggingface
  model: Qwen/Qwen2.5-14B-Instruct
  device: auto
  temperature: 0.2
  max_tokens: 512
  timeout_sec: 60.0
  max_retries: 3

market:
  # coherent_sampling MUST be off for shock experiments: shocks multiply
  # buyer.value and seller.cost before matching, and coherent_sampling
  # would overwrite those shocked values with ratio-based resampling.
  # Ranges are chosen so that pre-shock triples are almost always coherent
  # (seller.cost < ref_price, buyer.value > seller.cost), while post-shock
  # triples may become incoherent — that is the intended experimental signal.
  coherent_sampling: false
  item_ref_price_min: 100.0
  item_ref_price_max: 180.0
  buyer_value_min: 90.0
  buyer_value_max: 170.0
  seller_cost_min: 40.0
  seller_cost_max: 90.0
  buyer_budget_min: 120.0
  buyer_budget_max: 220.0
  seller_margin_min: 0.05
  seller_margin_max: 0.25
  buyer_patience_min: 3
  buyer_patience_max: 8
  seller_patience_min: 3
  seller_patience_max: 8
  num_item_types: 5

negotiation:
  max_rounds: 10
  min_price: 1.0
  max_price: 500.0
  gate_enabled: false

shock:
  enabled: true
  demand_multiplier_min: 0.7
  demand_multiplier_max: 1.3
  supply_multiplier_min: 0.7
  supply_multiplier_max: 1.3
  shock_probability: 0.3

prompt:
  include_deadline_salience: true
  include_objective_equations: true
