# Experiment I: Supply-Demand Structure
# Tests the law of supply and demand in LLM-driven bargaining markets.
#
# Research question: Do transaction prices and trade volume respond
# in the expected direction when demand or supply conditions shift?
#
# Conditions (in experiments.py):
#   baseline     - standard distributions
#   demand_shock - buyer values shifted upward (+20)
#   supply_shock - seller costs shifted upward (+20)
#
# The negotiation protocol, matching, and tick structure are identical
# across conditions. Only buyer/seller structural distributions differ.

agent_type: llm_free_language
mode: market
steps: 8
buyers_per_step: 8
sellers_per_step: 8
seed: 42
scenario_mode: distribution

llm:
  backend: huggingface
  model: Qwen/Qwen2.5-14B-Instruct
  device: auto
  temperature: 0.2
  max_tokens: 512
  timeout_sec: 60.0
  max_retries: 3

# Baseline market parameters (overridden per condition in experiments.py).
# coherent_sampling MUST be off: this experiment tests how shifting the
# absolute buyer_value / seller_cost distributions affects prices and
# volume.  Coherent sampling would overwrite those shifts.
market:
  coherent_sampling: false
  # Ranges are set so baseline triples are almost always coherent
  # (ref_price > seller_cost, buyer_value > seller_cost).  Condition
  # overrides in experiments.py shift buyer_value or seller_cost to
  # test supply/demand effects; those shifts may reduce ZOPA rates,
  # which is the intended experimental signal.
  item_ref_price_min: 100.0
  item_ref_price_max: 180.0
  buyer_value_min: 90.0
  buyer_value_max: 170.0
  seller_cost_min: 40.0
  seller_cost_max: 90.0
  buyer_budget_min: 120.0
  buyer_budget_max: 220.0
  seller_margin_min: 0.05
  seller_margin_max: 0.25
  buyer_patience_min: 3
  buyer_patience_max: 8
  seller_patience_min: 3
  seller_patience_max: 8
  num_item_types: 5

negotiation:
  max_rounds: 10
  min_price: 1.0
  max_price: 500.0
  gate_enabled: false

prompt:
  include_deadline_salience: true
  include_objective_equations: true

shock:
  enabled: false
