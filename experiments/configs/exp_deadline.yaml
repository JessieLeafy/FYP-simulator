# Experiment: Deadline Effects
# Run same scenario with varying max_rounds to measure agreement
# clustering near the deadline and success rate vs horizon length.
# Uses LLM deliberative agents to test whether deadline salience
# prompts actually change LLM concession behaviour.
agent_type: llm_deliberative
steps: 5
buyers_per_step: 10
sellers_per_step: 10
seed: 42
scenario_mode: fixed

llm:
  model: llama3.2:3b
  temperature: 0.2
  max_tokens: 256
  timeout_sec: 30.0
  max_retries: 3

fixed:
  buyer_value: 120.0
  buyer_budget: 130.0
  buyer_patience: 5
  seller_cost: 80.0
  seller_target_margin: 0.15
  seller_patience: 5
  item_reference_price: 100.0

negotiation:
  max_rounds: 10
  min_price: 1.0
  max_price: 500.0
  gate_enabled: false

prompt:
  include_deadline_salience: true
  include_objective_equations: true

shock:
  enabled: false
