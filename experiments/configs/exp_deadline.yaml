# Experiment C: Deadline Effects
# Run same scenario with varying max_rounds to measure agreement
# clustering near the deadline and success rate vs horizon length.
# Uses free-language agents to test whether deadline salience
# prompts actually change LLM concession behaviour.
#
# Conditions (in experiments.py) vary max_rounds: 6, 12, 20
# The max_rounds here is the base; the runner overrides per-arm.
agent_type: llm_free_language
steps: 5
buyers_per_step: 10
sellers_per_step: 10
seed: 42
scenario_mode: fixed

llm:
  backend: huggingface
  model: Qwen/Qwen2.5-14B-Instruct
  temperature: 0.2
  max_tokens: 512
  timeout_sec: 60.0
  max_retries: 3

fixed:
  buyer_value: 120.0
  buyer_budget: 130.0
  buyer_patience: 5
  seller_cost: 80.0
  seller_target_margin: 0.15
  seller_patience: 5
  item_reference_price: 100.0

negotiation:
  max_rounds: 20
  min_price: 1.0
  max_price: 500.0
  gate_enabled: false

prompt:
  include_deadline_salience: true
  include_objective_equations: true

shock:
  enabled: false
